<text x="760" y="610" font-size="16" text-anchor="start" font-weight="bold" fill="#222">Dicas</text>
<text x="760" y="640" font-size="14" text-anchor="start" font-weight="normal" fill="#333">• A e B no MESMO par trançado (laranja e laranja/branco): protege do ruído do inversor.</text>
<text x="760" y="666" font-size="14" text-anchor="start" font-weight="normal" fill="#333">• Sem leitura nenhuma? Inverta A e B.</text>
<text x="760" y="692" font-size="14" text-anchor="start" font-weight="normal" fill="#333">• Siga as letras impressas no conversor (A+ = A, B− = B), não a posição dos bornes.</text>
<text x="760" y="718" font-size="14" text-anchor="start" font-weight="normal" fill="#333">• NÃO ligue o cabo de rede em roteador/switch: ele está sendo usado só como fio.</text>
<text x="760" y="744" font-size="14" text-anchor="start" font-weight="normal" fill="#333">• Passe o cabo longe dos cabos grossos de bateria/inversor quando possível.</text>
<text x="760" y="770" font-size="14" text-anchor="start" font-weight="normal" fill="#333">• Não mexa nos bornes do lado das baterias (V+, V−, I): estão ligados direto em 24 V.</text>
